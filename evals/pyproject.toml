[project]
name = "design-evals"
version = "0.1.0"
description = "Judge the design documents the playbooks brainstorming skill produces: per-metric binary checks with quoted evidence."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[project.scripts]
design = "design.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]
notebook = ["jupyterlab>=4.0", "pandas>=2.0", "ipykernel>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["design"]

[tool.uv]
default-groups = ["dev", "notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
